<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Sale Card Component</title>
    <style>
      
      :root {
        --bg-canvas: oklch(0.98 0.005 240);
        --card-surface: #ffffff;
        --text-primary: oklch(0.15 0.02 240);
        --text-secondary: oklch(0.5 0.02 240);
        --accent-sale: oklch(0.6 0.22 20); 
        --radius-md: 12px;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

     
      .sale-card {
        background-color: var(--card-surface);
        width: 340px;
        border-radius: var(--radius-md);
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 16px -6px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        transition: transform 0.2s ease;
      }

      .sale-card:hover {
        transform: translateY(-4px);
      }

      
      .image-container {
        position: relative; 
        width: 100%;
        height: 340px;
        background: linear-gradient(
          135deg,
          oklch(0.9 0.03 240),
          oklch(0.8 0.04 250)
        );
        display: flex;
        justify-content: center;
        align-items: center;
      }

      
      .product-placeholder-graphic {
        width: 90px;
        height: 90px;
        fill: none;
        stroke: rgba(255, 255, 255, 0.6);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      
      .watermark-discount-badge {
        position: absolute;
        top: 24px;
        left: -32px;
        background-color: var(--accent-sale);
        color: #ffffff;
        font-size: 0.85rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 8px 36px;
        transform: rotate(
          -45deg
        ); 
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        user-select: none;
        pointer-events: none; 
      }

      
      .card-details {
        padding: 24px;
      }

      .category-tag {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        color: var(--text-secondary);
        margin: 0 0 6px 0;
      }

      .product-title {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 12px 0;
      }

      
      .price-group {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .sale-price {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--accent-sale);
      }

      .original-price {
        font-size: 1rem;
        color: var(--text-secondary);
        text-decoration: line-through; 
      }
    </style>
  </head>
  <body>
    <article class="sale-card">
      <div class="image-container">
        <div class="watermark-discount-badge">Up To 40% Off</div>

        <svg class="product-placeholder-graphic" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </div>

      <div class="card-details">
        <p class="category-tag">Premium Apparel</p>
        <h2 class="product-title">Minimalist Canvas Backpack</h2>

        <div class="price-group">
          <span class="sale-price">$45.00</span>
          <span class="original-price">$75.00</span>
        </div>
      </div>
    </article>
  </body>
</html>
